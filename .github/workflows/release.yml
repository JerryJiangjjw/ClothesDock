name: Build DMG and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="$(python3 scripts/version.py --tag "$REF_NAME")"
          else
            version="$(python3 scripts/version.py)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          swift --version
          xcode-select -p
          uname -m
      - name: Test
        run: ./scripts/test.sh
      - name: Build application
        run: ./scripts/build.sh
      - name: Package and verify DMG
        run: ./scripts/build-dmg.sh --skip-build
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            build/ClothesDock-${{ needs.version.outputs.version }}-${{ matrix.arch }}.dmg
            build/ClothesDock-${{ needs.version.outputs.version }}-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat > release-notes.md <<'NOTES'
          提供 Apple Silicon（arm64）和 Intel（x86_64）两个 DMG 安装包及 SHA-256 校验文件。
          将应用拖入 Applications 安装；要求 macOS 14 或更高版本。
          当前使用 ad-hoc 签名，尚未进行 Apple 公证。
          NOTES
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "ClothesDock $APP_VERSION" --generate-notes --notes-file release-notes.md
          fi
